[project]
name = "delivery-schedule-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "exauceh", email = "houeglaex@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.109",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pypdf>=7.1.0",
    "scipy>=1.18.1",
]

[project.scripts]
delivery-schedule-optimization = "delivery_schedule_optimization:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]
