[project]
name = "delivery-schedule-optimization"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "exauceh", email = "houeglaex@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "highspy>=1.8",
    "holidays>=0.109",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10,<3.11",
    "numpy>=2.1,<2.4",
    "pandas>=2.2,<3",
    "pulp>=3.0,<4",
    "pypdf>=7.1.0",
    "scipy>=1.16.3",
    "setuptools>=80,<81",
]

[project.scripts]
delivery-schedule-optimization = "delivery_schedule_optimization:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]
